# PROVE configuration — filled in during onboarding (.prove/docs/ONBOARDING.md).
# Any value left as "TBD" is flagged by `python .prove/runner check`.

[project]
# Short project name (used in status output and work items).
name = "TBD"
# One-line description of the domain and what artifacts this project ships.
domain = "TBD"

[engine]
# Command that runs the golden-fixture regression suite. Exit 0 = green.
# Example: ".venv/bin/python tooling/run.py regression"
regression_command = "TBD"

# Command that runs the production engine over a bounded corpus sample for
# ONE artifact. "{artifact}" is replaced with the artifact name.
# Must use the production parser + engine and respect the corpus bound.
# Example: ".venv/bin/python tooling/run.py fire-rate {artifact} --max-files 5000"
evidence_command = "TBD"

# Optional: command that lists existing artifacts / landscape. "" to skip.
status_command = ""

# Path (relative to project root) where candidate artifacts are authored.
# Example: "data/carrier_rules_v4.json"  or  "rules/"
artifact_store = "TBD"

# Path to the activation allowlist — the data-only file whose edit is the
# ONLY thing that activates an artifact (P5). The runner never edits it;
# it only verifies the human's edit.
# Example: "data/active_rules.json"
activation_file = "TBD"

[review]
# Where expert review workbooks are delivered (path, URL, or channel name).
expert_channel = "TBD"
# Refinement loop converges when the expert's false-positive rate on the
# review sample drops below this fraction.
fp_threshold = 0.10
# Maximum refinement iterations before forced escalation (never fudge this
# to "just ship it" — non-convergence is a signal).
max_refine_iterations = 3
# Number of flagged documents sampled into each review workbook.
sample_size = 50

[corpus]
# Path to the raw corpus the engine scans for evidence.
path = "TBD"
# Hard cap on documents per evidence scan.
scan_bound = 5000
# Governance statement — shown by `check`, kept as a standing reminder.
governance = "Evidence must be generated by the production path over raw corpus documents. Derived extracts are forbidden."

[tracking]
# Work-item system: "azure-devops", "jira", "github", or "none".
system = "none"
# Parent epic/project/label for artifact work items ("" if not applicable).
parent = ""
